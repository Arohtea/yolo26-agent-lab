[unix_http_server]
file=%(here)s/../storage/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../storage/logs/supervisor.log
pidfile=%(here)s/../storage/supervisor.pid
childlogdir=%(here)s/../storage/logs
directory=%(here)s/..

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../storage/supervisor.sock

[program:api]
command=%(ENV_CONDA_PREFIX)s/bin/yolo-agent api
directory=%(here)s/..
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/api-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:agent-controller]
command=%(ENV_CONDA_PREFIX)s/bin/yolo-agent agent-controller
directory=%(here)s/..
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=190
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/agent-controller-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:worker]
command=%(ENV_CONDA_PREFIX)s/bin/yolo-agent worker
directory=%(here)s/..
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/worker-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:data-worker]
command=%(ENV_CONDA_PREFIX)s/bin/yolo-agent worker
directory=%(here)s/..
environment=YOLO_QUEUE_NAME="yolo-data",YOLO_DEVICE="cpu",OMP_NUM_THREADS="4",MKL_NUM_THREADS="4"
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/data-worker-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:annotation-worker]
command=%(ENV_CONDA_PREFIX)s/bin/yolo-agent annotation-worker
directory=%(here)s/..
autostart=true
autorestart=unexpected
startsecs=5
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../storage/logs/annotation-worker-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
