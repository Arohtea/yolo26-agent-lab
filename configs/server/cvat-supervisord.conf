; 服务器无 Docker 时的原生 CVAT v2.64.0：进程划分与参数取自官方 compose 和镜像内 supervisord 配置，
; 各服务改为监听本机回环地址，全部以镜像中的 django 用户（uid 1000）运行。
; 数据目录布局见 docs/deployment.md「无 Docker 的 GPU 服务器」。

[unix_http_server]
file=/data/cvat/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/django/logs/supervisor/supervisord.log
pidfile=/data/cvat/run/supervisord.pid
childlogdir=/home/django/logs/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///data/cvat/run/supervisor.sock

; ---- 依赖服务：与官方 compose 版本一致（PostgreSQL 15、Redis 7.2.11、kvrocks 2.15.0、OPA 1.12.2）----

[program:postgres]
command=/data/miniconda/envs/cvat-services/bin/postgres -D /data/cvat/postgres -c listen_addresses=127.0.0.1 -c port=5432 -c unix_socket_directories=/data/cvat/run
user=django
priority=10
stopsignal=INT
stopwaitsecs=60
redirect_stderr=true

[program:redis-inmem]
command=/data/miniconda/envs/cvat-services/bin/redis-server --bind 127.0.0.1 --port 6380 --dir /data/cvat/redis-inmem --save "60 100" --appendonly yes
user=django
priority=10
redirect_stderr=true

; WARN：kvrocks 官方二进制基于 Debian 12，需要 glibc 2.36；用随附的 Debian 运行库和加载器启动，不改动系统库。
[program:kvrocks]
command=/data/cvat/bin/kvrocks-libs/ld-linux-x86-64.so.2 --library-path /data/cvat/bin/kvrocks-libs /data/cvat/bin/kvrocks -c /data/cvat/bin/kvrocks.conf.orig --dir /data/cvat/kvrocks --pidfile /data/cvat/run/kvrocks.pid --bind 127.0.0.1 --port 6666 --compact-cron "0 3 * * *"
user=django
priority=10
redirect_stderr=true

[program:opa]
command=/data/cvat/bin/opa run --server --addr=127.0.0.1:8181 --log-level=error --disable-telemetry --set=services.cvat.url=http://127.0.0.1:8081 --set=bundles.cvat.service=cvat --set=bundles.cvat.resource=/api/auth/rules --set=bundles.cvat.polling.min_delay_seconds=5 --set=bundles.cvat.polling.max_delay_seconds=15
directory=/data/cvat/run
user=django
priority=20
redirect_stderr=true

[program:smokescreen]
command=/data/cvat/bin/smokescreen --listen-ip=127.0.0.1
user=django
priority=20
redirect_stderr=true

; ---- CVAT 应用：init 对应 compose 中 cvat_server 的 "init"，其余进程等待迁移完成后启动 ----

[program:init]
command=%(here)s/cvat-run.sh sh -c "./backend_entrypoint.sh init && python3 manage.py collectstatic --no-input"
user=django
priority=30
autorestart=false
startsecs=0
redirect_stderr=true

[fcgi-program:uvicorn]
socket=unix:///data/cvat/run/uvicorn.sock
socket_owner=django
socket_mode=0600
command=%(here)s/cvat-run.sh --wait python3 -m uvicorn --fd 0 --forwarded-allow-ips='*' cvat.asgi:application
environment=CVAT_EVENTS_LOCAL_DB_FILENAME="events_%(process_num)03d.db",CVAT_POSTGRES_APPLICATION_NAME="cvat:server"
numprocs=2
process_name=%(program_name)s-%(process_num)d
user=django
priority=40
autorestart=true
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -c %(here)s/cvat-nginx.conf -g "daemon off;"
user=django
priority=40
autorestart=true
redirect_stderr=true

[program:rqscheduler]
command=%(here)s/cvat-run.sh --wait python3 rqscheduler.py --host 127.0.0.1 --port 6380 --password "" -i 30 --path /home/django
user=django
priority=50
autorestart=true
redirect_stderr=true

; 队列分组与进程数沿用官方 compose 的 cvat_worker_* 服务
[program:worker-utils]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 notifications cleaning --worker-class cvat.rqworker.DefaultWorker
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-import]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 import --worker-class cvat.rqworker.DefaultWorker
numprocs=2
process_name=%(program_name)s-%(process_num)d
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-export]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 export --worker-class cvat.rqworker.DefaultWorker
numprocs=2
process_name=%(program_name)s-%(process_num)d
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-annotation]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 annotation --worker-class cvat.rqworker.DefaultWorker
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-webhooks]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 webhooks --worker-class cvat.rqworker.DefaultWorker
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-quality-reports]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 quality_reports --worker-class cvat.rqworker.DefaultWorker
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-chunks]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 chunks --worker-class cvat.rqworker.DefaultWorker
numprocs=2
process_name=%(program_name)s-%(process_num)d
user=django
priority=50
autorestart=true
redirect_stderr=true

[program:worker-consensus]
command=%(here)s/cvat-run.sh --wait python3 manage.py rqworker -v 3 consensus --worker-class cvat.rqworker.DefaultWorker
user=django
priority=50
autorestart=true
redirect_stderr=true
