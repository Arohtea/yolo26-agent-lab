; 服务器无 Docker：Redis、MLflow 由 conda 环境 yolo26-services 提供，替代 docker-compose.yml 中的两个容器。
; API、Worker、控制器沿用本机配置；需在激活 yolo26-agent-lab 环境后启动，两个环境同在 envs/ 目录下。
[include]
files = ../supervisord.conf

; supervisorctl 不处理 include，需在主配置中声明
[supervisorctl]
serverurl=unix://%(here)s/../../storage/supervisor.sock

[program:redis]
command=%(ENV_CONDA_PREFIX)s/../yolo26-services/bin/redis-server --bind 127.0.0.1 --port 6379 --dir %(here)s/../../storage/redis --appendonly yes --appendfsync everysec
directory=%(here)s/../..
priority=10
autorestart=true
redirect_stderr=true
stdout_logfile=%(here)s/../../storage/logs/redis-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:mlflow]
command=%(ENV_CONDA_PREFIX)s/../yolo26-services/bin/mlflow server --host 127.0.0.1 --port 5001 --workers 1 --backend-store-uri sqlite:///%(here)s/../../storage/mlflow/mlflow.db --serve-artifacts --artifacts-destination %(here)s/../../storage/mlflow/artifacts --allowed-hosts "localhost:*,127.0.0.1:*"
directory=%(here)s/../..
priority=10
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../storage/logs/mlflow-supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
