# 原生 CVAT 的单端口入口，替代官方 compose 中 traefik、cvat_ui 与 cvat_server 内置的三层 nginx。
# 路由沿用 traefik 规则：/api/、/admin、/django-rq 交后端，其余为中文 UI 静态文件。
worker_processes 2;
pid /data/cvat/run/nginx.pid;
error_log /home/django/logs/nginx_error.log;

events {
  worker_connections 512;
}

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  server_tokens off;

  include /etc/nginx/mime.types;
  # Ubuntu 22.04 的 nginx 1.18 未登记 mjs，UI 的模块脚本需要 JS 类型才能加载
  types {
    application/javascript mjs;
  }
  default_type application/octet-stream;

  client_body_temp_path /data/cvat/run/nginx/body;
  proxy_temp_path /data/cvat/run/nginx/proxy 1 2;
  fastcgi_temp_path /data/cvat/run/nginx/fastcgi;
  uwsgi_temp_path /data/cvat/run/nginx/uwsgi;
  scgi_temp_path /data/cvat/run/nginx/scgi;
  access_log /home/django/logs/nginx_access.log;

  # 仅在后端未提供时补充安全头，与官方 cvat/nginx.conf 一致
  map $upstream_http_referrer_policy $hdr_referrer_policy {
    '' "strict-origin-when-cross-origin";
  }
  map $upstream_http_x_content_type_options $hdr_x_content_type_options {
    '' "nosniff";
  }
  map $upstream_http_x_frame_options $hdr_x_frame_options {
    '' "deny";
  }
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream uvicorn {
    server unix:/data/cvat/run/uvicorn.sock;
  }

  server {
    listen 127.0.0.1:8081;
    server_name _;
    client_max_body_size 0;
    root /data/cvat/ui;

    location ~ ^/(api/|admin|django-rq) {
      add_header Referrer-Policy $hdr_referrer_policy always;
      add_header X-Content-Type-Options $hdr_x_content_type_options always;
      add_header X-Frame-Options $hdr_x_frame_options always;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
      proxy_buffering on;
      proxy_buffers 16 8k;
      proxy_pass http://uvicorn;
    }

    location /static/ {
      gzip on;
      gzip_comp_level 6;
      gzip_types application/javascript application/x-javascript text/javascript application/wasm image/x-icon;
      alias /home/django/static/;
    }

    # 后端经 X-Accel-Redirect 下发的数据文件，禁止直接访问
    location /data/ {
      internal;
      alias /home/django/data/;
    }

    location / {
      gzip on;
      gzip_comp_level 6;
      gzip_types application/javascript application/x-javascript text/javascript application/wasm image/x-icon;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires 0;
      add_header Cross-Origin-Opener-Policy "same-origin";
      add_header Cross-Origin-Embedder-Policy "credentialless";
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header X-Content-Type-Options "nosniff" always;
      # 人工审核嵌入工作台：去掉上游 UI 的 X-Frame-Options deny，只允许经隧道访问的本机工作台嵌入
      add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:18000 http://127.0.0.1:18000" always;
    }

    location /assets {
      expires 1y;
      add_header Cache-Control "public";
      add_header Cross-Origin-Embedder-Policy "require-corp";
      add_header Service-Worker-Allowed "/" always;
      access_log off;
    }
  }
}
