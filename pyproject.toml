[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "yolo26-agent-lab"
version = "0.1.0"
description = "YOLO26 自主训练平台基础设施与数据集管理"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "pydantic-settings[yaml]>=2.8,<3", "SQLAlchemy>=2.0,<3",
  "alembic>=1.15,<2", "redis>=5.2,<8", "rq>=2.2,<4",
  "mlflow-skinny==3.18.0", "httpx>=0.28,<1",
  "psutil>=6,<8", "nvidia-ml-py>=12,<14",
  "python-json-logger>=3,<5", "packaging>=24,<27",
  "numpy>=2.1,<3",
  "Pillow>=12,<14", "ImageHash>=4.3,<5", "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2", "networkx>=3.4,<4", "python-multipart>=0.0.20,<1",
  "transformers>=4.57,<5", "cvat-sdk==2.64.0", "opencv-python-headless>=4.10,<5",
  "supervisor>=4.3,<5",
  "datumaro>=1.13,<2",
]

[project.scripts]
yolo-agent = "yolo_agent.cli:main"

[project.optional-dependencies]
examples = ["pooch>=1.8,<2"]
vision = ["torchvision==0.25.0"]
training = ["ultralytics-opencv-headless==8.4.210"]
# WARN：ETA 0.17 仍按旧元数据语义访问可选字段，限制回移库避免导入失败。
evaluation = ["fiftyone==1.22.1", "importlib-metadata==7.2.1", "faster-coco-eval>=1.6.7,<2"]
export = ["onnx==1.23.2", "onnxslim==0.1.99", "onnxruntime==1.31.1"]
agent = ["langgraph==1.2.20", "langgraph-checkpoint-sqlite==3.1.3", "optuna==4.9.0", "openai==2.54.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/yolo_agent"]
